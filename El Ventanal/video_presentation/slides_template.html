  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Dynamic Ambient Glow background */
    .bg-glow-1 {
      position: absolute;
      top: -150px;
      left: -150px;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(9, 13, 22, 0) 70%);
      filter: blur(60px);
      z-index: 1;
    }
    .bg-glow-2 {
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, rgba(9, 13, 22, 0) 70%);
      filter: blur(60px);
      z-index: 1;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 2;
      opacity: 0.6;
    }

    /* Container Card */
    .slide-card {
      position: relative;
      z-index: 10;
      width: 1760px;
      height: 940px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(6, 182, 212, 0.15);
    }

    /* Header */
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 24px;
    }
    .slide-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #38bdf8;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .slide-num {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #94a3b8;
    }

    /* Titles */
    .title-box { margin-top: 15px; }
    h1.slide-title {
      font-family: 'Outfit', sans-serif;
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.slide-subtitle {
      font-size: 1.4rem;
      color: #94a3b8;
      margin-top: 10px;
      font-weight: 400;
    }

    /* Body Layouts */
    .content-body {
      flex: 1;
      margin-top: 30px;
      display: flex;
      gap: 50px;
      align-items: center;
    }

    /* Grid layout */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 100%; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; width: 100%; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 24px; width: 100%; }

    /* Feature Cards */
    .info-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px;
      transition: all 0.3s ease;
    }
    .info-card.highlight {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(139, 92, 246, 0.15));
      border-color: rgba(6, 182, 212, 0.5);
    }
    .info-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .info-card p {
      font-size: 1.15rem;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .stat-number {
      font-family: 'Outfit', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      color: #f59e0b;
      line-height: 1;
      margin-bottom: 8px;
    }

    /* Image Display Frame */
    .img-frame {
      width: 100%;
      height: 480px;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(6, 182, 212, 0.4);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Footer Progress Bar */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

      display: flex;
      align-items: center;
      gap: 15px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #94a3b8;

    .progress-bar-bg {
      width: 300px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      width: 0%;
    }
  </style>
</head>

              <img src="./images/${data.image}" style="width:100%; height:100%; object-fit:contain; background:#090d16;" alt="Logo">
            </div>
            <div style="flex: 1;">${data.content}</div>
          </div>
        `;
      } else {
        bodyHtml = `<div class="content-body">${data.content}</div>`;
      }

      const fillPct = Math.round(((index + 1) / slidesData.length) * 100);

      container.innerHTML = `
        <div class="slide-header">
          <div class="slide-tag">✨ ${data.tag}</div>
          <div class="slide-num">${data.num}</div>
        </div>
        <div class="title-box">
          <h1 class="slide-title">${data.title}</h1>
          <p class="slide-subtitle">${data.subtitle}</p>
        </div>
        ${bodyHtml}
        <div class="slide-footer">
          <div class="brand-footer">
            <img src="./images/logo.jpg" alt="Logo">
            <span>EL VENTANAL • PANTALLAS CULTURALES</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${fillPct}%;"></div>
          </div>
        </div>
      `;
    }

    // Default load slide 0
    renderSlide(0);
  </script>
</body>
</html>
